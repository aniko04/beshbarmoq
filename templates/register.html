<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ro'yxatdan o'tish — Inkorporatsion topshiriqlar platformasi</title>
    {# `?v=` — kesh buzg'unchi; statik fayllar hashlanmaydi (base.html ga qarang). #}
    <link rel="stylesheet" href="/static/css/platform.css?v=54">
    <link rel="stylesheet" href="/static/css/auth.css?v=7">
    {# Shriftlar bloklamasdan — izoh base.html da #}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" media="print" onload="this.media='all'"
          href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap">
    <link rel="icon" href="/static/img/favicon.ico" sizes="48x48">
    <link rel="icon" type="image/png" href="/static/img/favicon-32.png" sizes="32x32">
    <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
</head>
<body class="pf auth-page">
    <div class="auth-card">
        <a class="auth-brand" href="/">
            <img src="/static/img/logo.png" alt="" width="256" height="256">
            <span>
                <span class="sub">Inkorporatsion</span>
                <span class="name">Topshiriqlar</span>
            </span>
        </a>

        <h1>Ro'yxatdan o'tish</h1>
        <p class="subtitle">Yangi hisob yarating</p>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-row">
                <div class="form-group">
                    <label for="first_name">Ism</label>
                    <input id="first_name" type="text" name="first_name" placeholder="Ismingiz">
                </div>
                <div class="form-group">
                    <label for="last_name">Familiya</label>
                    <input id="last_name" type="text" name="last_name" placeholder="Familiyangiz">
                </div>
            </div>
            <div class="form-group">
                <label for="username">Login</label>
                <input id="username" type="text" name="username" placeholder="Login tanlang" required>
            </div>
            <div class="form-group">
                <label for="password">Parol</label>
                <div class="parol-quti">
                <input id="password" type="password" name="password" placeholder="Parol kiriting" required>
                <button type="button" class="parol-koz" aria-label="Parolni ko'rsatish" aria-pressed="false">
                    <svg class="koz-ochiq" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg class="koz-yopiq" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18M10.6 10.6A3 3 0 0 0 13.4 13.4M9.9 5.2A10.5 10.5 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.1 3.9M6.6 6.6C3.8 8.5 2 12 2 12s3.6 7 10 7a9.8 9.8 0 0 0 4.4-1"/></svg>
                </button>
            </div>
            </div>
            <div class="form-group">
                <label for="password2">Parolni tasdiqlang</label>
                <div class="parol-quti">
                <input id="password2" type="password" name="password2" placeholder="Parolni qayta kiriting" required>
                <button type="button" class="parol-koz" aria-label="Parolni ko'rsatish" aria-pressed="false">
                    <svg class="koz-ochiq" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg class="koz-yopiq" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18M10.6 10.6A3 3 0 0 0 13.4 13.4M9.9 5.2A10.5 10.5 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.1 3.9M6.6 6.6C3.8 8.5 2 12 2 12s3.6 7 10 7a9.8 9.8 0 0 0 4.4-1"/></svg>
                </button>
            </div>
            </div>
            <div class="form-group">
                <label>Rolingiz</label>
                <div class="role-group">
                    <label class="role-option">
                        <input type="radio" name="role" value="oquvchi" {% if role != 'talaba' %}checked{% endif %}>
                        <span>&#x1F9D2; O'quvchi</span>
                    </label>
                    <label class="role-option">
                        <input type="radio" name="role" value="talaba" {% if role == 'talaba' %}checked{% endif %}>
                        <span>&#x1F393; O'qituvchi</span>
                    </label>
                </div>
            </div>
            <button type="submit" class="auth-btn">Ro'yxatdan o'tish</button>
        </form>

        <div class="auth-link">
            Hisobingiz bormi? <a href="/login{% if request.GET.next %}?next={{ request.GET.next|urlencode }}{% endif %}">Kirish</a>
        </div>
        <a href="/" class="back-home">&larr; Bosh sahifaga</a>
    </div>
    <script>
        // Parol ko'z tugmasi: bosganda maydon type i almashadi, ikonka ham.
        (function () {
            document.querySelectorAll('.parol-koz').forEach(function (tugma) {
                tugma.addEventListener('click', function () {
                    var maydon = tugma.parentNode.querySelector('input');
                    var ochiq = maydon.type === 'password';
                    maydon.type = ochiq ? 'text' : 'password';
                    tugma.classList.toggle('ochiq', ochiq);
                    tugma.setAttribute('aria-pressed', ochiq ? 'true' : 'false');
                    tugma.setAttribute('aria-label', ochiq ? 'Parolni yashirish' : "Parolni ko'rsatish");
                    maydon.focus();
                });
            });
        })();
    </script>
</body>
</html>
