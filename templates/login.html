<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirish — Inkorporatsion topshiriqlar platformasi</title>
    <link rel="stylesheet" href="/static/css/platform.css">
    <link rel="stylesheet" href="/static/css/auth.css">
    <link rel="icon" href="/static/img/favicon.ico" sizes="48x48">
    <link rel="icon" type="image/png" href="/static/img/favicon-32.png" sizes="32x32">
    <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
</head>
<body class="pf auth-page">
    <div class="auth-card">
        <a class="auth-brand" href="/">
            <img src="/static/img/logo.png" alt="" width="256" height="256">
            <span>
                <span class="sub">Inkorporatsion</span>
                <span class="name">Topshiriqlar</span>
            </span>
        </a>

        <h1>Kirish</h1>
        <p class="subtitle">Platformaga kirish uchun ma'lumotlaringizni kiriting</p>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Login</label>
                <input id="username" type="text" name="username" placeholder="Loginingizni kiriting" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Parol</label>
                <input id="password" type="password" name="password" placeholder="Parolingizni kiriting" required>
            </div>
            <button type="submit" class="auth-btn">Kirish</button>
        </form>

        <div class="auth-link">
            Hisobingiz yo'qmi? <a href="/register{% if request.GET.next %}?next={{ request.GET.next|urlencode }}{% endif %}">Ro'yxatdan o'tish</a>
        </div>
        <a href="/" class="back-home">&larr; Bosh sahifaga</a>
    </div>
</body>
</html>
