<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirish</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .auth-card {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1.5px solid rgba(255, 255, 255, 0.78);
            border-radius: 28px;
            padding: 44px 38px;
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
            box-shadow: 0 26px 60px rgba(124, 58, 237, 0.22);
        }
        .auth-card h2 {
            text-align: center;
            font-family: var(--font-display);
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #7c3aed 0%, #ec4899 60%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .auth-card p.subtitle {
            text-align: center;
            color: var(--ink-2);
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 28px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            color: var(--ink);
            font-size: 0.88rem;
            font-weight: 800;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 13px 16px;
            border: 2px solid var(--line);
            border-radius: 14px;
            background: var(--paper-soft);
            color: var(--ink);
            font-size: 1rem;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-group input:focus {
            border-color: #7c3aed;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(124,58,237,0.15);
        }
        .form-group input::placeholder {
            color: var(--ink-3);
            font-weight: 600;
        }
        .auth-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #7c3aed, #ec4899);
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: var(--font-display);
            cursor: pointer;
            box-shadow: 0 6px 0 #6d28d9, 0 12px 22px rgba(124,58,237,0.28);
            transition: transform 0.12s, box-shadow 0.12s;
            margin-top: 8px;
        }
        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #6d28d9, 0 16px 28px rgba(124,58,237,0.34);
        }
        .auth-btn:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #6d28d9, 0 8px 14px rgba(124,58,237,0.3);
        }
        .auth-link {
            text-align: center;
            margin-top: 20px;
            color: var(--ink-2);
            font-size: 0.92rem;
            font-weight: 600;
        }
        .auth-link a {
            color: #7c3aed;
            text-decoration: none;
            font-weight: 800;
        }
        .auth-link a:hover {
            text-decoration: underline;
        }
        .error-msg {
            background: #fef2f2;
            border: 2px solid #fecaca;
            color: #dc2626;
            padding: 11px 14px;
            border-radius: 12px;
            font-size: 0.92rem;
            font-weight: 700;
            margin-bottom: 18px;
            text-align: center;
        }
        .back-home {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: var(--ink-3);
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 700;
        }
        .back-home:hover {
            color: var(--grape);
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2>Kirish</h2>
        <p class="subtitle">Platformaga kirish uchun ma'lumotlaringizni kiriting</p>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Login</label>
                <input type="text" name="username" placeholder="Loginingizni kiriting" required autofocus>
            </div>
            <div class="form-group">
                <label>Parol</label>
                <input type="password" name="password" placeholder="Parolingizni kiriting" required>
            </div>
            <button type="submit" class="auth-btn">Kirish</button>
        </form>

        <div class="auth-link">
            Hisobingiz yo'qmi? <a href="/register{% if request.GET.next %}?next={{ request.GET.next|urlencode }}{% endif %}">Ro'yxatdan o'tish</a>
        </div>
        <a href="/" class="back-home">&larr; Bosh sahifaga</a>
    </div>
</body>
</html>
