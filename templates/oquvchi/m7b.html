<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mashq 7 - Test</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    {% comment %}
        Shriftlar bloklamasdan yuklanadi. CSS `@import` BO'LMASIN: u
        render-blocking, ya'ni Google Fonts sekinlashsa sahifadagi
        inline <script> lar ishga tushmay, test/krossvord qotib qoladi.
    {% endcomment %}
    <link rel="stylesheet" media="print" onload="this.media='all'"
          href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
    </noscript>
    <link rel="stylesheet" href="/static/css/style.css?v=2">
    <link rel="stylesheet" href="/static/css/mashq6.css?v=2">
    <link rel="icon" href="/static/img/favicon.ico" sizes="48x48">
    <link rel="icon" type="image/png" href="/static/img/favicon-32.png" sizes="32x32">
    <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
</head>
<body class="t-rose">
    <a href="/multimediya" class="back-link">&larr; Orqaga</a>
    <h1 class="mashq-title">Test savollariga javob bering</h1>

    <div class="quiz-card mashq6-card">
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="progress-text" id="progress-text">0 / 8</div>

        <div class="test-questions" id="test-questions"></div>

        <div class="btn-area">
            <button class="check-btn" id="check-btn" onclick="checkAnswers()">Tekshirish</button>
            <button class="retry-btn" id="retry-btn" onclick="retry()">Qayta urinish</button>
            <a href="/o7c" class="next-btn" id="next-btn">Keyingi bosqich &rarr;</a>
        </div>

        <div class="result-msg" id="result"></div>
    </div>

    <script>
    // ===== Test savollari (namuna Word hujjatidan, shu sahifaning ichida) =====
    const questions = [
        {
            question: "Origami nima?",
            options: [
                "Rasm chizish san'ati",
                "Qog'ozni buklash san'ati",
                "Haykal yasash san'ati",
                "Gazlama tikish san'ati"
            ],
            correctAnswer: "Qog'ozni buklash san'ati"
        },
        {
            question: "Origami qaysi davlatda paydo bo'lgan?",
            options: ["Xitoy", "Koreya", "Yaponiya", "Hindiston"],
            correctAnswer: "Yaponiya"
        },
        {
            question: "Origami yasash uchun eng asosiy material nima?",
            options: ["Mato", "Karton", "Qog'oz", "Yog'och"],
            correctAnswer: "Qog'oz"
        },
        {
            question: "Origami yasashda odatda nima ishlatilmaydi?",
            options: ["Qog'oz", "Buklash", "Qaychi va yelim", "Diqqat"],
            correctAnswer: "Qaychi va yelim"
        },
        {
            question: "Qog'ozni ikki qismga keltirish harakati nima deyiladi?",
            options: ["Chizish", "Buklash", "Yelimlash", "Bo'yash"],
            correctAnswer: "Buklash"
        },
        {
            question: "Origami texnologiya fanining qaysi yo'nalishiga kiradi?",
            options: [
                "Pazandachilik",
                "Qog'oz bilan ishlash",
                "Gazlama bilan ishlash",
                "Tabiiy materiallar bilan ishlash"
            ],
            correctAnswer: "Qog'oz bilan ishlash"
        },
        {
            question: "Origami yasashda qog'oz qanday bo'lishi kerak?",
            options: ["Toza va tekis", "Yirtilgan", "Ho'l", "Kir"],
            correctAnswer: "Toza va tekis"
        },
        {
            question: "Origami buyumlari nimadan tayyorlanadi?",
            options: ["Yog'ochdan", "Temirdan", "Qog'ozdan", "Shishadan"],
            correctAnswer: "Qog'ozdan"
        }
    ];

    const TOTAL = questions.length;
    let selected = {}; // { questionIndex: selectedOptionText }
    let checked = false;

    function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    function updateProgress() {
        const answered = Object.keys(selected).length;
        document.getElementById('progress-text').textContent = answered + ' / ' + TOTAL;
        document.getElementById('progress-fill').style.width = (answered / TOTAL * 100) + '%';
    }

    function renderQuestions() {
        const container = document.getElementById('test-questions');
        container.innerHTML = '';

        questions.forEach((q, qIndex) => {
            const qDiv = document.createElement('div');
            qDiv.className = 'test-question';
            qDiv.dataset.index = qIndex;

            const title = document.createElement('div');
            title.className = 'question-title';
            title.textContent = (qIndex + 1) + '. ' + q.question;
            qDiv.appendChild(title);

            const optionsDiv = document.createElement('div');
            optionsDiv.className = 'question-options';

            const shuffled = shuffle(q.options);
            const letters = ['A', 'B', 'C', 'D'];

            shuffled.forEach((opt, oIndex) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.dataset.question = qIndex;
                btn.dataset.value = opt;

                const letter = document.createElement('span');
                letter.className = 'option-letter';
                letter.textContent = letters[oIndex];

                const text = document.createElement('span');
                text.className = 'option-text';
                text.textContent = opt;

                btn.appendChild(letter);
                btn.appendChild(text);

                btn.addEventListener('click', function () {
                    if (checked) return;
                    selectOption(qIndex, opt);
                });

                optionsDiv.appendChild(btn);
            });

            qDiv.appendChild(optionsDiv);
            container.appendChild(qDiv);
        });
    }

    function selectOption(qIndex, value) {
        selected[qIndex] = value;

        const btns = document.querySelectorAll('.option-btn[data-question="' + qIndex + '"]');
        btns.forEach(btn => {
            if (btn.dataset.value === value) {
                btn.classList.add('selected');
            } else {
                btn.classList.remove('selected');
            }
        });

        updateProgress();
    }

    function checkAnswers() {
        if (Object.keys(selected).length < TOTAL) {
            const qoldi = TOTAL - Object.keys(selected).length;
            document.getElementById('result').textContent =
                'Avval barcha savollarga javob bering! (' + qoldi + ' ta qoldi)';
            document.getElementById('result').className = 'result-msg fail';
            return;
        }

        checked = true;
        let correct = 0;

        questions.forEach((q, qIndex) => {
            const btns = document.querySelectorAll('.option-btn[data-question="' + qIndex + '"]');
            const userAnswer = selected[qIndex];

            btns.forEach(btn => {
                btn.classList.add('disabled');

                if (btn.dataset.value === q.correctAnswer) {
                    btn.classList.add('correct');
                }

                if (btn.dataset.value === userAnswer && userAnswer !== q.correctAnswer) {
                    btn.classList.add('wrong');
                }
            });

            if (userAnswer === q.correctAnswer) {
                correct++;
            }
        });

        if (correct === TOTAL) {
            document.getElementById('result').textContent =
                "Barakalla! Barcha javoblar to'g'ri! (" + correct + '/' + TOTAL + ')';
            document.getElementById('result').className = 'result-msg success';
        } else {
            document.getElementById('result').textContent =
                correct + ' / ' + TOTAL + " ta to'g'ri.";
            document.getElementById('result').className = 'result-msg fail';
        }

        document.getElementById('check-btn').style.display = 'none';
        document.getElementById('retry-btn').style.display = 'inline-block';
        document.getElementById('next-btn').style.display = 'inline-block';

        // Natijani serverga yuborish
        fetch('/api/save-result', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken')},
            body: JSON.stringify({mashq: 'm7b', score: correct, total: TOTAL, is_passed: correct === TOTAL})
        }).catch(() => {});
    }

    function retry() {
        selected = {};
        checked = false;
        document.getElementById('result').textContent = '';
        document.getElementById('result').className = 'result-msg';
        document.getElementById('check-btn').style.display = 'inline-block';
        document.getElementById('retry-btn').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';
        renderQuestions();
        updateProgress();
    }

    // CSRF token helper
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    // Boshlash
    document.getElementById('retry-btn').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';
    renderQuestions();
    updateProgress();
    </script>
</body>
</html>
