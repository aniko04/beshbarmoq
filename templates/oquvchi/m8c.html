<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mashq 8 - Krossvord</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    {% comment %}
        Shriftlar bloklamasdan yuklanadi. CSS `@import` BO'LMASIN: u
        render-blocking, ya'ni Google Fonts sekinlashsa sahifadagi
        inline <script> lar ishga tushmay, test/krossvord qotib qoladi.
    {% endcomment %}
    <link rel="stylesheet" media="print" onload="this.media='all'"
          href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
    </noscript>
    <link rel="stylesheet" href="/static/css/style.css?v=2">
    <link rel="stylesheet" href="/static/css/mashq6.css?v=2">
    <style>
        .mashq6c-card{max-width:100%;width:100%;padding:36px}
        .main-layout{display:grid;grid-template-columns:1fr auto 1fr;gap:24px;align-items:start}
        .crossword-center{display:flex;flex-direction:column;align-items:center;overflow-x:auto;max-width:100%}
        .crossword-grid{display:grid;grid-template-columns:repeat(10,38px);grid-template-rows:repeat(13,38px);gap:2px;width:fit-content}
        .cell{width:38px;height:38px;position:relative}
        .cell.black{background:transparent;pointer-events:none}
        .cell input{width:100%;height:100%;border:2px solid var(--line-2);border-radius:6px;text-align:center;font-size:16px;font-weight:800;font-family:'Nunito',sans-serif;text-transform:uppercase;outline:none;background:#fff;color:var(--ink);transition:.2s;padding:0}
        .cell input.digraph{font-size:12px;letter-spacing:-0.5px}
        .cell input:focus{border-color:#7c3aed;background:#f5f0ff;transform:scale(1.06)}
        .cell input.hl{background:#f3ecff;border-color:#c4b5fd}
        .cell input.correct{background:#dcfce7!important;border-color:#16a34a!important;color:#15803d!important}
        .cell input.incorrect{background:#fee2e2!important;border-color:#dc2626!important;color:#dc2626!important}
        .num-badge{position:absolute;top:1px;left:2px;font-size:9px;font-weight:800;color:#fff;min-width:14px;height:14px;padding:0 2px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:10;pointer-events:none;line-height:1}
        .num-badge.second{left:auto;right:2px}
        .clues-col h3{font-family:var(--font-display);font-weight:700;color:var(--ink);margin-bottom:14px;font-size:1.2em;text-align:center}
        .clue-item{margin-bottom:8px;padding:10px 12px;background:var(--paper-soft);border:1px solid var(--line);border-radius:10px;border-left:4px solid #7c3aed;font-size:.84rem;font-weight:600;color:var(--ink-2);line-height:1.4}
        .clue-item b{color:var(--ink)}
        .clues-col.clues-right .clue-item{border-left:1px solid var(--line);border-right:4px solid #ec4899}
        @media(max-width:1200px){
            .main-layout{grid-template-columns:1fr;justify-items:center}
            .crossword-center{order:0}
            .clues-col.clues-left{order:1}
            .clues-col.clues-right{order:2}
            .clues-col{max-width:600px;width:100%}
        }
        @media(max-width:700px){
            .crossword-grid{grid-template-columns:repeat(10,30px);grid-template-rows:repeat(13,30px)}
            .cell{width:30px;height:30px}.cell input{font-size:12px}.cell input.digraph{font-size:9px}
            .num-badge{font-size:7px;min-width:12px;height:12px}
            .mashq6c-card{padding:16px 8px}
        }
    </style>
    <link rel="icon" href="/static/img/favicon.ico" sizes="48x48">
    <link rel="icon" type="image/png" href="/static/img/favicon-32.png" sizes="32x32">
    <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
</head>
<body class="t-indigo">
    <a href="/o8b" class="back-link">&larr; Orqaga</a>
    <h1 class="mashq-title">Krossvordni yeching!</h1>
    <div class="quiz-card mashq6-card mashq6c-card">
        <div class="main-layout">
            <div class="clues-col clues-left">
                <h3>Eniga &rarr;</h3>
                <div id="clues-h"></div>
            </div>
            <div class="crossword-center">
                <div class="crossword-grid" id="grid"></div>
                <div class="btn-area">
                    <button class="check-btn" id="check-btn" onclick="checkAnswers()">Tekshirish</button>
                    <button class="retry-btn" id="retry-btn" onclick="retry()">Qayta urinish</button>
                </div>
                <div class="result-msg" id="result"></div>
            </div>
            <div class="clues-col clues-right">
                <h3>Bo'yiga &darr;</h3>
                <div id="clues-v"></div>
            </div>
        </div>
    </div>
<script>
var ROWS=13, COLS=10;
var dir='h';
var focusedCell=null;

// Javoblar (qator-ustun -> harf). CH, SH kabilar bitta katakda (digraf).
var answers={
// 1-eniga: FETR | 2-bo'yiga: TEXNOLOGIYA
'0-2':'F','0-3':'E','0-4':'T','0-5':'R',
'1-4':'E',
'2-4':'X',
// 3-eniga: SUVENIR | 3-bo'yiga: SABR | 4-bo'yiga: RANG
'3-0':'S','3-1':'U','3-2':'V','3-3':'E','3-4':'N','3-5':'I','3-6':'R',
'4-0':'A','4-4':'O','4-6':'A',
'5-0':'B','5-4':'L','5-6':'N',
'6-0':'R','6-4':'O','6-6':'G',
'7-4':'G',
// 5-eniga: QAYCHI
'8-0':'Q','8-1':'A','8-2':'Y','8-3':'CH','8-4':'I',
// 6-eniga: YUMSHOQ
'9-4':'Y','9-5':'U','9-6':'M','9-7':'SH','9-8':'O','9-9':'Q',
// 7-eniga: IGNA | 8-bo'yiga: GUL
'10-1':'I','10-2':'G','10-3':'N','10-4':'A',
'11-2':'U',
// 9-eniga: YELIM
'12-0':'Y','12-1':'E','12-2':'L','12-3':'I','12-4':'M'
};

var nums={
'0-2':[{n:'1',c:'#1b8a2f'}],
'0-4':[{n:'2',c:'#1e88e5'}],
'3-0':[{n:'3',c:'#7b2ff7'}],
'3-6':[{n:'4',c:'#e53935'}],
'8-0':[{n:'5',c:'#f97316'}],
'9-4':[{n:'6',c:'#e6a817'}],
'10-1':[{n:'7',c:'#1b8a2f'}],
'10-2':[{n:'8',c:'#e53935'}],
'12-0':[{n:'9',c:'#1e88e5'}]
};

// So'z chegaralari: eniga [qator, boshCol, oxirCol], bo'yiga [ustun, boshRow, oxirRow]
var hRanges=[[0,2,5],[3,0,6],[8,0,4],[9,4,9],[10,1,4],[12,0,4]];
var vRanges=[[4,0,10],[0,3,6],[6,3,6],[2,10,12]];

var hSet=new Set(), vSet=new Set();
hRanges.forEach(function(w){ for(var c=w[1];c<=w[2];c++) hSet.add(w[0]+'-'+c); });
vRanges.forEach(function(w){ for(var r=w[1];r<=w[2];r++) vSet.add(r+'-'+w[0]); });

function has(r,c){ return (r+'-'+c) in answers; }
function getInp(r,c){ return document.querySelector('input[data-row="'+r+'"][data-col="'+c+'"]'); }

function autoDir(r,c){
    var k=r+'-'+c;
    var isH=hSet.has(k), isV=vSet.has(k);
    if(isH&&!isV) return 'h';
    if(isV&&!isH) return 'v';
    return dir;
}

function highlightWord(r,c){
    document.querySelectorAll('.cell input.hl').forEach(function(i){ i.classList.remove('hl'); });
    var i,w;
    if(dir==='h'){
        for(i=0;i<hRanges.length;i++){
            w=hRanges[i];
            if(w[0]===r && c>=w[1] && c<=w[2]){
                for(var nc=w[1];nc<=w[2];nc++){ var el=getInp(w[0],nc); if(el) el.classList.add('hl'); }
                return;
            }
        }
    }
    if(dir==='v'){
        for(i=0;i<vRanges.length;i++){
            w=vRanges[i];
            if(w[0]===c && r>=w[1] && r<=w[2]){
                for(var nr=w[1];nr<=w[2];nr++){ var el2=getInp(nr,w[0]); if(el2) el2.classList.add('hl'); }
                return;
            }
        }
    }
}

function nextCell(r,c){
    if(dir==='h'){ for(var nc=c+1;nc<COLS;nc++) if(has(r,nc)) return getInp(r,nc); }
    else { for(var nr=r+1;nr<ROWS;nr++) if(has(nr,c)) return getInp(nr,c); }
    return null;
}
function prevCell(r,c){
    if(dir==='h'){ for(var nc=c-1;nc>=0;nc--) if(has(r,nc)) return getInp(r,nc); }
    else { for(var nr=r-1;nr>=0;nr--) if(has(nr,c)) return getInp(nr,c); }
    return null;
}

var g=document.getElementById('grid');
for(var r=0;r<ROWS;r++){
    for(var c=0;c<COLS;c++){
        var cell=document.createElement('div');
        cell.className='cell';
        var key=r+'-'+c;
        if(!(key in answers)){
            cell.classList.add('black');
        }else{
            var ans=answers[key];
            var inp=document.createElement('input');
            inp.type='text';
            inp.maxLength=ans.length;
            inp.dataset.row=r; inp.dataset.col=c;
            if(ans.length>1) inp.classList.add('digraph');
            if(nums[key]){
                nums[key].forEach(function(b){
                    var badge=document.createElement('div');
                    badge.className='num-badge'+(b.second?' second':'');
                    badge.textContent=b.n;
                    badge.style.background=b.c;
                    cell.appendChild(badge);
                });
            }
            inp.addEventListener('mousedown',(function(inp){
                return function(){
                    var r2=+inp.dataset.row, c2=+inp.dataset.col;
                    var k=r2+'-'+c2;
                    if(focusedCell===inp && hSet.has(k) && vSet.has(k)){
                        dir=(dir==='h'?'v':'h');
                        highlightWord(r2,c2);
                    }else{
                        dir=autoDir(r2,c2);
                    }
                };
            })(inp));
            inp.addEventListener('focus',(function(inp){
                return function(){
                    focusedCell=inp;
                    highlightWord(+inp.dataset.row,+inp.dataset.col);
                };
            })(inp));
            inp.addEventListener('input',(function(inp){
                return function(){
                    inp.value=inp.value.toUpperCase();
                    if(inp.value.length>=inp.maxLength){
                        var r2=+inp.dataset.row, c2=+inp.dataset.col;
                        var nx=nextCell(r2,c2);
                        if(nx) nx.focus();
                    }
                };
            })(inp));
            inp.addEventListener('keydown',(function(inp){
                return function(e){
                    var r2=+inp.dataset.row, c2=+inp.dataset.col;
                    if(e.key==='Backspace'&&!inp.value){
                        e.preventDefault();
                        var pv=prevCell(r2,c2);
                        if(pv) pv.focus();
                    }
                    if(e.key==='ArrowRight'){ e.preventDefault(); dir='h'; var nx=nextCell(r2,c2); if(nx) nx.focus(); else highlightWord(r2,c2); }
                    if(e.key==='ArrowLeft'){ e.preventDefault(); dir='h'; var pv2=prevCell(r2,c2); if(pv2) pv2.focus(); else highlightWord(r2,c2); }
                    if(e.key==='ArrowDown'){ e.preventDefault(); dir='v'; if(has(r2+1,c2)){ getInp(r2+1,c2).focus(); } else highlightWord(r2,c2); }
                    if(e.key==='ArrowUp'){ e.preventDefault(); dir='v'; if(has(r2-1,c2)){ getInp(r2-1,c2).focus(); } else highlightWord(r2,c2); }
                };
            })(inp));
            cell.appendChild(inp);
        }
        g.appendChild(cell);
    }
}

function checkAnswers(){
    var inputs=document.querySelectorAll('.cell input');
    var total=0,correct=0;
    inputs.forEach(function(inp){
        total++;
        var key=inp.dataset.row+'-'+inp.dataset.col;
        var ok=inp.value.toUpperCase()===answers[key];
        inp.classList.remove('correct','incorrect','hl');
        inp.classList.add(ok?'correct':'incorrect');
        if(ok) correct++;
        inp.disabled=true;
    });
    var res=document.getElementById('result');
    if(correct===total){
        res.textContent="Barakalla! Krossvord to'liq to'g'ri yechildi!";
        res.className='result-msg success';
    }else{
        res.textContent=correct+' / '+total+" ta harf to'g'ri. Qayta urinib ko'ring!";
        res.className='result-msg fail';
    }
    document.getElementById('check-btn').style.display='none';
    document.getElementById('retry-btn').style.display='inline-block';
}

function retry(){
    document.querySelectorAll('.cell input').forEach(function(inp){
        inp.value='';inp.disabled=false;
        inp.classList.remove('correct','incorrect','hl');
    });
    document.getElementById('result').textContent='';
    document.getElementById('result').className='result-msg';
    document.getElementById('check-btn').style.display='inline-block';
    document.getElementById('retry-btn').style.display='none';
    focusedCell=null;
}

// Savollar
document.getElementById('clues-h').innerHTML=
'<div class="clue-item"><b>1.</b> Yumshoq mato turi.</div>'+
'<div class="clue-item"><b>3.</b> Fetrdan tayyorlanadigan bezak turi.</div>'+
'<div class="clue-item"><b>5.</b> Fetrni kesadigan asbob.</div>'+
'<div class="clue-item"><b>6.</b> Fetrning asosiy xususiyati.</div>'+
'<div class="clue-item"><b>7.</b> Fetr bilan ishlashda kerak bo\'ladigan buyum.</div>'+
'<div class="clue-item"><b>9.</b> Fetr bo\'laklarini biriktiruvchi vosita.</div>';

document.getElementById('clues-v').innerHTML=
'<div class="clue-item"><b>2.</b> Fetr bilan ishlash o\'rganiladigan fan.</div>'+
'<div class="clue-item"><b>3.</b> Fetr bilan ishlashda rivojlanadigan sifat.</div>'+
'<div class="clue-item"><b>4.</b> Fetr buyumlariga chiroy beruvchi element.</div>'+
'<div class="clue-item"><b>8.</b> Fetrdan yasaladigan buyum.</div>';

document.getElementById('retry-btn').style.display='none';
</script>
</body>
</html>
