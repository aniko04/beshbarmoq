<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mashq 10 - Test</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/mashq6.css">
</head>
<body class="t-emerald">
    <a href="/" class="back-link">&larr; Orqaga</a>
    <h1 class="mashq-title">Test savollariga javob bering</h1>

    <div class="quiz-card mashq6-card">
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="progress-text" id="progress-text">0 / 10</div>

        <div class="test-questions" id="test-questions"></div>

        <div class="btn-area">
            <button class="check-btn" id="check-btn" onclick="checkAnswers()">Tekshirish</button>
            <button class="retry-btn" id="retry-btn" onclick="retry()">Qayta urinish</button>
            <a href="/o10c" class="next-btn" id="next-btn">Keyingi bosqich &rarr;</a>
        </div>

        <div class="result-msg" id="result"></div>
    </div>

    <script>
    // ===== Test savollari (namuna Word hujjatidan, shu sahifaning ichida) =====
    const questions = [
        {
            question: "Plastilin nima?",
            options: ["Yog'och materiali", "Yumshoq modellash materiali", "Metall", "Qog'oz"],
            correctAnswer: "Yumshoq modellash materiali"
        },
        {
            question: "Loy va plastilin bilan nima qilish mumkin?",
            options: ["Buyum yasash", "Tikish", "Yozish", "Bo'yash"],
            correctAnswer: "Buyum yasash"
        },
        {
            question: "Plastilinning asosiy xususiyati qanday?",
            options: ["Qattiq", "Egiluvchan va yumshoq", "Shaffof", "Mo'rt"],
            correctAnswer: "Egiluvchan va yumshoq"
        },
        {
            question: "Loy va plastilin bilan ishlash qaysi fanda o'rganiladi?",
            options: ["Musiqa", "Texnologiya", "Ona tili", "Jismoniy tarbiya"],
            correctAnswer: "Texnologiya"
        },
        {
            question: "Plastilindan nima yasash mumkin?",
            options: ["Mevalar", "Hayvonlar", "Qahramonlar", "Barchasi"],
            correctAnswer: "Barchasi"
        },
        {
            question: "Ishdan so'ng qo'llarni nima qilish kerak?",
            options: ["Yuvish", "Bo'yash", "Quritish", "Yopishtirish"],
            correctAnswer: "Yuvish"
        },
        {
            question: "Loy bilan ishlash nimani rivojlantiradi?",
            options: ["Mayda qo'l harakatlarini", "Yugurishni", "Suzishni", "Sakrashni"],
            correctAnswer: "Mayda qo'l harakatlarini"
        },
        {
            question: "Plastilin qanday ranglarda bo'ladi?",
            options: ["Faqat oq", "Turli ranglarda", "Faqat qora", "Faqat yashil"],
            correctAnswer: "Turli ranglarda"
        },
        {
            question: "Loy va plastilin bilan ishlashda nima muhim?",
            options: ["Tozalik va ehtiyotkorlik", "Yugurish", "Shovqin qilish", "O'ynash"],
            correctAnswer: "Tozalik va ehtiyotkorlik"
        },
        {
            question: "Plastilin yordamida buyum yasash qanday faoliyat hisoblanadi?",
            options: ["Amaliy faoliyat", "Sport faoliyati", "Musiqiy faoliyat", "O'yin faoliyati"],
            correctAnswer: "Amaliy faoliyat"
        }
    ];

    const TOTAL = questions.length;
    let selected = {};
    let checked = false;

    function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    function updateProgress() {
        const answered = Object.keys(selected).length;
        document.getElementById('progress-text').textContent = answered + ' / ' + TOTAL;
        document.getElementById('progress-fill').style.width = (answered / TOTAL * 100) + '%';
    }

    function renderQuestions() {
        const container = document.getElementById('test-questions');
        container.innerHTML = '';

        questions.forEach((q, qIndex) => {
            const qDiv = document.createElement('div');
            qDiv.className = 'test-question';
            qDiv.dataset.index = qIndex;

            const title = document.createElement('div');
            title.className = 'question-title';
            title.textContent = (qIndex + 1) + '. ' + q.question;
            qDiv.appendChild(title);

            const optionsDiv = document.createElement('div');
            optionsDiv.className = 'question-options';

            const shuffled = shuffle(q.options);
            const letters = ['A', 'B', 'C', 'D'];

            shuffled.forEach((opt, oIndex) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.dataset.question = qIndex;
                btn.dataset.value = opt;

                const letter = document.createElement('span');
                letter.className = 'option-letter';
                letter.textContent = letters[oIndex];

                const text = document.createElement('span');
                text.className = 'option-text';
                text.textContent = opt;

                btn.appendChild(letter);
                btn.appendChild(text);

                btn.addEventListener('click', function () {
                    if (checked) return;
                    selectOption(qIndex, opt);
                });

                optionsDiv.appendChild(btn);
            });

            qDiv.appendChild(optionsDiv);
            container.appendChild(qDiv);
        });
    }

    function selectOption(qIndex, value) {
        selected[qIndex] = value;
        const btns = document.querySelectorAll('.option-btn[data-question="' + qIndex + '"]');
        btns.forEach(btn => {
            if (btn.dataset.value === value) {
                btn.classList.add('selected');
            } else {
                btn.classList.remove('selected');
            }
        });
        updateProgress();
    }

    function checkAnswers() {
        if (Object.keys(selected).length < TOTAL) {
            const qoldi = TOTAL - Object.keys(selected).length;
            document.getElementById('result').textContent =
                'Avval barcha savollarga javob bering! (' + qoldi + ' ta qoldi)';
            document.getElementById('result').className = 'result-msg fail';
            return;
        }

        checked = true;
        let correct = 0;

        questions.forEach((q, qIndex) => {
            const btns = document.querySelectorAll('.option-btn[data-question="' + qIndex + '"]');
            const userAnswer = selected[qIndex];

            btns.forEach(btn => {
                btn.classList.add('disabled');
                if (btn.dataset.value === q.correctAnswer) {
                    btn.classList.add('correct');
                }
                if (btn.dataset.value === userAnswer && userAnswer !== q.correctAnswer) {
                    btn.classList.add('wrong');
                }
            });

            if (userAnswer === q.correctAnswer) {
                correct++;
            }
        });

        if (correct === TOTAL) {
            document.getElementById('result').textContent =
                "Barakalla! Barcha javoblar to'g'ri! (" + correct + '/' + TOTAL + ')';
            document.getElementById('result').className = 'result-msg success';
        } else {
            document.getElementById('result').textContent =
                correct + ' / ' + TOTAL + " ta to'g'ri.";
            document.getElementById('result').className = 'result-msg fail';
        }

        document.getElementById('check-btn').style.display = 'none';
        document.getElementById('retry-btn').style.display = 'inline-block';
        document.getElementById('next-btn').style.display = 'inline-block';

        fetch('/api/save-result', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken')},
            body: JSON.stringify({mashq: 'm10b', score: correct, total: TOTAL, is_passed: correct === TOTAL})
        }).catch(() => {});
    }

    function retry() {
        selected = {};
        checked = false;
        document.getElementById('result').textContent = '';
        document.getElementById('result').className = 'result-msg';
        document.getElementById('check-btn').style.display = 'inline-block';
        document.getElementById('retry-btn').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';
        renderQuestions();
        updateProgress();
    }

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    document.getElementById('retry-btn').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';
    renderQuestions();
    updateProgress();
    </script>
</body>
</html>
