<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ro'yxatdan o'tish</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .auth-card {
            background: rgba(255,255,255,0.07);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 24px;
            padding: 40px 36px;
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
        }
        .auth-card h2 {
            text-align: center;
            color: #fff;
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff 0%, #c084fc 60%, #ea4c89 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .auth-card p.subtitle {
            text-align: center;
            color: rgba(255,255,255,0.5);
            font-size: 0.9rem;
            margin-bottom: 28px;
        }
        .form-row {
            display: flex;
            gap: 12px;
        }
        .form-row .form-group {
            flex: 1;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            color: rgba(255,255,255,0.7);
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            background: rgba(255,255,255,0.06);
            color: #fff;
            font-size: 1rem;
            font-family: 'Nunito', sans-serif;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .form-group input:focus {
            border-color: #c084fc;
            box-shadow: 0 0 0 3px rgba(192,132,252,0.2);
        }
        .form-group input::placeholder {
            color: rgba(255,255,255,0.3);
        }
        .auth-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            color: #fff;
            font-size: 1.05rem;
            font-weight: 700;
            font-family: 'Nunito', sans-serif;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 8px;
        }
        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(139,92,246,0.4);
        }
        .auth-link {
            text-align: center;
            margin-top: 20px;
            color: rgba(255,255,255,0.5);
            font-size: 0.9rem;
        }
        .auth-link a {
            color: #c084fc;
            text-decoration: none;
            font-weight: 700;
        }
        .auth-link a:hover {
            text-decoration: underline;
        }
        .error-msg {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.9rem;
            margin-bottom: 18px;
            text-align: center;
        }
        .back-home {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: rgba(255,255,255,0.4);
            text-decoration: none;
            font-size: 0.85rem;
        }
        .back-home:hover {
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2>Ro'yxatdan o'tish</h2>
        <p class="subtitle">Yangi hisob yarating</p>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-row">
                <div class="form-group">
                    <label>Ism</label>
                    <input type="text" name="first_name" placeholder="Ismingiz">
                </div>
                <div class="form-group">
                    <label>Familiya</label>
                    <input type="text" name="last_name" placeholder="Familiyangiz">
                </div>
            </div>
            <div class="form-group">
                <label>Login</label>
                <input type="text" name="username" placeholder="Login tanlang" required>
            </div>
            <div class="form-group">
                <label>Parol</label>
                <input type="password" name="password" placeholder="Parol kiriting" required>
            </div>
            <div class="form-group">
                <label>Parolni tasdiqlang</label>
                <input type="password" name="password2" placeholder="Parolni qayta kiriting" required>
            </div>
            <button type="submit" class="auth-btn">Ro'yxatdan o'tish</button>
        </form>

        <div class="auth-link">
            Hisobingiz bormi? <a href="/login">Kirish</a>
        </div>
        <a href="/" class="back-home">&larr; Bosh sahifaga</a>
    </div>
</body>
</html>
