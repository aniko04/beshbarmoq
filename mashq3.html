<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mashq 3 - Topishmoq Arena</title>
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="stylesheet" href="static/css/mashq3.css">
</head>
<body>
    <a href="/" class="back-link">&larr; Orqaga</a>

    <!-- ===== START SCREEN ===== -->
    <div id="start-screen" class="m3-screen m3-active">
        <div class="m3-start-box">
            <div class="m3-start-icon">&#127919;</div>
            <h1 class="m3-title">Topishmoq Arena</h1>
            <p class="m3-subtitle">Kasblarni topishmoqlar orqali toping!</p>
            <div class="m3-rules">
                <div class="m3-rule"><span class="m3-rule-num">1</span> Topishmoq o'qiladi</div>
                <div class="m3-rule"><span class="m3-rule-num">2</span> Rasmlar tanlanadi</div>
                <div class="m3-rule"><span class="m3-rule-num">3</span> To'g'ri deb topilgan rasm belgilanadi</div>
                <div class="m3-rule"><span class="m3-rule-num">4</span> 3 ta imkoniyatingiz bor — diqqatli bo'ling</div>
            </div>
            <button id="start-btn" class="m3-start-btn">Boshlash</button>
        </div>
    </div>

    <!-- ===== GAME SCREEN ===== -->
    <div id="game-screen" class="m3-screen">
        <!-- HUD -->
        <div class="m3-hud">
            <div class="m3-hud-lives" id="hud-lives">
                <span class="m3-heart active" data-i="0">&#10084;&#65039;</span>
                <span class="m3-heart active" data-i="1">&#10084;&#65039;</span>
                <span class="m3-heart active" data-i="2">&#10084;&#65039;</span>
            </div>
            <div class="m3-hud-center">
                <span class="m3-round-text" id="round-text">Raund 1 / 12</span>
                <div class="m3-progress">
                    <div class="m3-progress-fill" id="progress-fill"></div>
                </div>
            </div>
            <div class="m3-hud-score">
                <span class="m3-score" id="score-display">0</span>
                <span class="m3-streak m3-hidden" id="streak-badge">&#128293; x0</span>
            </div>
        </div>

        <!-- Game Layout -->
        <div class="m3-layout">
            <!-- Riddle Panel -->
            <div class="m3-riddle-panel">
                <div class="m3-riddle-badge" id="riddle-badge">#1</div>
                <div class="m3-riddle-text" id="riddle-text"></div>
                <div class="m3-hint-area m3-hidden" id="hint-area"></div>
                <div class="m3-riddle-actions">
                    <button class="m3-hint-btn" id="hint-btn">&#128161; Ishora</button>
                    <button class="m3-discover-btn m3-hidden" id="discover-btn">&#128294; Kashf et!</button>
                </div>
            </div>

            <!-- Arena -->
            <div class="m3-arena" id="arena">
                <div class="m3-arena-grid" id="arena-grid">
                    <!-- Cards generated by JS -->
                </div>
                <div class="m3-spotlight-glow m3-hidden" id="spotlight-glow"></div>
            </div>
        </div>

        <!-- Confirm button -->
        <button class="m3-confirm-btn m3-hidden" id="confirm-btn">Tasdiqlash</button>
    </div>

    <!-- ===== SUMMARY SCREEN ===== -->
    <div id="summary-screen" class="m3-screen">
        <div class="m3-summary-box">
            <h2 class="m3-summary-title">O'yin yakunlandi!</h2>
            <div class="m3-summary-stats">
                <div class="m3-stat">
                    <span class="m3-stat-icon">&#9989;</span>
                    <span class="m3-stat-val" id="stat-correct">0</span>
                    <span class="m3-stat-label">To'g'ri</span>
                </div>
                <div class="m3-stat">
                    <span class="m3-stat-icon">&#10060;</span>
                    <span class="m3-stat-val" id="stat-wrong">0</span>
                    <span class="m3-stat-label">Noto'g'ri</span>
                </div>
            </div>
            <div class="m3-summary-actions">
                <button class="m3-replay-btn" id="replay-btn">Qayta o'ynash</button>
                <a href="/" class="m3-home-btn">Bosh sahifa</a>
            </div>
        </div>
    </div>

    <script src="static/js/mashq3.js"></script>
</body>
</html>
